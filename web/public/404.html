<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Indonesia Financial Overview</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0e3134" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background-color: #f6f1e5;
        color: #142a36;
        font-family: Georgia, "Times New Roman", serif;
      }
      main {
        width: min(38rem, 100%);
      }
      img {
        width: 3rem;
        height: 3rem;
        border-radius: 0.75rem;
      }
      p.eyebrow {
        margin: 1.5rem 0 0;
        font-family: system-ui, sans-serif;
        font-size: 0.65rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #6c6656;
      }
      h1 {
        margin: 0.75rem 0 0;
        font-size: clamp(2.6rem, 8vw, 4.4rem);
        font-weight: 500;
        line-height: 0.95;
        letter-spacing: -0.04em;
        color: #17324a;
      }
      h1 span {
        display: block;
        font-style: italic;
        color: #2c6b64;
      }
      p.lede {
        margin: 1.5rem 0 0;
        max-width: 30rem;
        font-size: 1.05rem;
        line-height: 1.6;
        color: rgba(20, 42, 54, 0.75);
      }
      a {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.7rem 1.1rem;
        border: 1px solid #17324a;
        border-radius: 0.5rem;
        color: #17324a;
        font-family: system-ui, sans-serif;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        text-decoration: none;
      }
      a:hover {
        background: #17324a;
        color: #f8f3e8;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" width="48" height="48" />
      <p class="eyebrow">Indonesia Financial Overview</p>
      <h1>Page not found<span>Not in this snapshot.</span></h1>
      <p class="lede">
        The page you requested is not part of the dashboard. The latest official indicators are on
        the front page.
      </p>
      <a href="/">Back to the dashboard</a>
    </main>
  </body>
</html>
